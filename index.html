<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de Hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161A; --panel:#1B2126; --panel-2:#232B31; --line:#333C43;
    --parchment:#EDE7DA; --muted:#8B9299;
    --gold:#D4AC6E; --gold-dim:#8A733E; --gold-soft:rgba(212,172,110,.12);
    --done:#69987A; --done-dim:#2E3B32;
    --missed:#C05F45; --missed-dim:#3D2822;
    --shadow:0 8px 24px rgba(0,0,0,.28); --shadow-sm:0 2px 10px rgba(0,0,0,.18);
    --r-lg:16px; --r-md:12px; --r-sm:9px;
  }
  :root.light{
    --ink:#F5F1E8; --panel:#FFFFFF; --panel-2:#F3EEE1; --line:#E1D8C2;
    --parchment:#211D17; --muted:#867F6E;
    --gold:#A5813F; --gold-dim:#D9C79A; --gold-soft:rgba(165,129,63,.1);
    --done:#3E6B4C; --done-dim:#DEEBE2;
    --missed:#A0432D; --missed-dim:#F4DED7;
    --shadow:0 10px 28px rgba(80,65,30,.1); --shadow-sm:0 2px 10px rgba(80,65,30,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--parchment);font-family:'Inter',sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s;
    background-image:radial-gradient(circle at 15% 0%, var(--gold-soft), transparent 45%);
  }
  .wrap{max-width:1040px;margin:0 auto;padding:30px 18px 60px;}
  ::selection{background:var(--gold);color:var(--ink);}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  header.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .brand-mark{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:32px;margin:0;letter-spacing:-.01em;background:linear-gradient(90deg,var(--parchment),var(--gold) 130%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top-right{display:flex;align-items:center;gap:10px;}
  .theme-btn{background:var(--panel);border:1px solid var(--line);color:var(--parchment);width:38px;height:38px;border-radius:var(--r-sm);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:.15s;}
  .theme-btn:hover{border-color:var(--gold);transform:translateY(-1px);}
  .tabs{display:flex;gap:3px;background:var(--panel);padding:4px;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .tab-btn{font-family:'Inter';font-size:12.5px;font-weight:600;background:transparent;border:none;color:var(--muted);padding:9px 15px;border-radius:9px;cursor:pointer;transition:.18s;}
  .tab-btn:hover{color:var(--parchment);}
  .tab-btn.active{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.25);}
  .tab-badge{display:inline-block;min-width:15px;height:15px;line-height:15px;padding:0 4px;margin-left:5px;background:var(--missed);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;vertical-align:middle;}
  .tab-badge:empty{display:none;}

  .toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .toolbar input.search{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);color:var(--parchment);padding:10px 14px;border-radius:var(--r-sm);font-size:13px;outline:none;transition:.15s;}
  .toolbar input.search:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
  .icon-btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:10px 14px;border-radius:var(--r-sm);font-size:12.5px;cursor:pointer;font-family:'Inter';font-weight:600;white-space:nowrap;transition:.15s;box-shadow:var(--shadow-sm);}
  .icon-btn:hover{color:var(--parchment);border-color:var(--gold);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0);}

  .add-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:22px;display:none;box-shadow:var(--shadow);}
  .add-panel.open{display:block;animation:panelIn .2s ease;}
  @keyframes panelIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .add-grid{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  .add-grid input[type=text].name{flex:2;min-width:170px;}
  .add-grid input, .add-grid select{background:var(--panel-2);border:1px solid var(--line);color:var(--parchment);padding:10px 12px;border-radius:var(--r-sm);font-family:'Inter';font-size:13.5px;outline:none;transition:.15s;}
  .add-grid input:focus, .add-grid select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
  .add-grid input.emoji{width:54px;text-align:center;}
  .add-grid select{cursor:pointer;}
  .color-pick-wrap{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px 6px 6px;}
  .swatches{display:flex;gap:7px;}
  .swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
  .swatch:hover{transform:scale(1.15);}
  .swatch.sel{border-color:var(--parchment);transform:scale(1.15);box-shadow:0 0 0 2px var(--panel-2), 0 0 0 3px var(--gold);}
  .color-wheel-wrap{position:relative;width:30px;height:30px;flex:none;}
  .color-wheel-wrap input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border:none;border-radius:50%;padding:0;cursor:pointer;background:conic-gradient(red,#ff0,lime,cyan,blue,magenta,red);box-shadow:0 0 0 2px var(--panel-2), 0 0 0 3px var(--line);}
  .color-wheel-wrap input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:50%;overflow:hidden;}
  .color-wheel-wrap input[type=color]::-webkit-color-swatch{border:2px solid var(--panel-2);border-radius:50%;}
  .color-wheel-wrap input[type=color]::-moz-color-swatch{border:2px solid var(--panel-2);border-radius:50%;}
  .add-grid button.save{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--ink);border:none;padding:10px 20px;border-radius:var(--r-sm);font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.2);transition:.15s;}
  .add-grid button.save:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,0,0,.28);}

  .empty{text-align:center;padding:64px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-lg);font-size:14px;line-height:1.6;}
  .empty b{color:var(--parchment);}

  .analytics{display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .chart-card{flex:2;min-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px 14px;box-shadow:var(--shadow-sm);}
  .chart-card h4, .progress-card h4{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 14px;font-weight:500;}
  .bar-chart{display:flex;align-items:flex-end;gap:2px;height:90px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar-fill{width:100%;background:var(--gold-dim);border-radius:3px 3px 0 0;min-height:2px;transition:.15s;}
  .bar-fill.full{background:linear-gradient(180deg,var(--gold),var(--gold-dim));}
  .bar-fill.zero{background:var(--panel-2);}
  .bar-col:hover .bar-fill{background:var(--gold);}
  .bar-axis{display:flex;gap:2px;margin-top:6px;}
  .bar-axis span{flex:1;text-align:center;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);}

  .progress-card{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow-sm);}
  .prog-item{margin-bottom:13px;}
  .prog-item:last-child{margin-bottom:0;}
  .prog-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:6px;}
  .prog-top .pname{font-weight:600;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor;}
  .prog-top .pval{font-family:'JetBrains Mono',monospace;color:var(--gold);flex:none;}
  .prog-track{height:7px;background:var(--panel-2);border-radius:5px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:5px;transition:.3s;}

  .ledger{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto;box-shadow:var(--shadow-sm);}
  table.grid{border-collapse:collapse;width:100%;min-width:640px;}
  table.grid th, table.grid td{border-bottom:1px solid var(--line);}
  table.grid thead th{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);padding:11px 3px;text-align:center;font-weight:500;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);}
  table.grid thead th.dow-sat, table.grid thead th.dow-sun{color:var(--gold);}
  .habit-col{text-align:left !important;position:sticky;left:0;background:var(--panel);padding:11px 14px !important;font-family:'Inter';font-weight:600;font-size:13px;min-width:172px;max-width:172px;z-index:2;border-left:3px solid var(--habit-color,var(--gold));}
  .habit-name-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .habit-label{display:flex;align-items:center;gap:6px;overflow:hidden;}
  .habit-label .em{flex:none;}
  .habit-label .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .habit-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:3px;}
  .habit-actions{display:flex;gap:2px;flex:none;}
  .habit-actions button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;opacity:.5;padding:2px 3px;transition:.15s;}
  .habit-actions button:hover{opacity:1;}
  .habit-actions .del:hover{color:var(--missed);}
  .habit-actions .arc:hover{color:var(--gold);}
  td.cell{text-align:center;padding:0;width:27px;height:44px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;transition:background .12s;}
  td.cell:hover{background:var(--panel-2);}
  td.cell.done{color:var(--done);background:var(--done-dim);}
  td.cell.missed{color:var(--missed);background:var(--missed-dim);}
  td.cell.future{cursor:default;opacity:.3;}
  .pct-col{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:right !important;padding-right:15px !important;color:var(--gold);min-width:54px;}

  .legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:14px;height:14px;border-radius:4px;display:inline-block;}

  .year-block{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;border-left:3px solid var(--habit-color,var(--gold));box-shadow:var(--shadow-sm);}
  .year-block h3{font-family:'Fraunces',serif;font-size:17px;margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .year-block h3 .ypct{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--gold);}
  .heat-grid{display:grid;gap:2px;}
  .heat-cell{aspect-ratio:1;border-radius:2px;background:var(--panel-2);}
  .heat-cell.miss{background:var(--missed-dim);}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:11px;margin-bottom:18px;}
  .kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px;box-shadow:var(--shadow-sm);transition:.15s;}
  .kpi-card:hover{border-color:var(--gold-dim);transform:translateY(-2px);}
  .backup-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:var(--panel-2);border:1px solid var(--gold-dim);border-radius:var(--r-md);padding:13px 15px;margin-bottom:16px;font-size:12.5px;color:var(--parchment);}
  .backup-banner .icon-btn{flex:none;}
  .kpi-card .num{font-family:'Fraunces',serif;font-size:29px;font-weight:700;color:var(--gold);}
  .kpi-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
  .badges-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .badges-card h4{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:0 0 10px;font-weight:500;}
  .badge-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;}
  .badge-row:last-child{border-bottom:none;}
  .badge-name{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;overflow:hidden;}
  .badge-name .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge-medals{display:flex;gap:4px;font-size:15px;flex:none;}
  .badge-medals .off{opacity:.18;filter:grayscale(1);}
  .archived-list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 17px;font-size:13px;color:var(--muted);box-shadow:var(--shadow-sm);}
  .archived-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);}
  .archived-item:last-child{border-bottom:none;}
  .archived-item button{background:var(--panel-2);border:1px solid var(--line);color:var(--parchment);border-radius:7px;padding:4px 10px;font-size:11.5px;cursor:pointer;}

  .nav-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
  .nav-btn{background:var(--panel);border:1px solid var(--line);color:var(--parchment);width:36px;height:36px;border-radius:var(--r-sm);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);transition:.15s;}
  .nav-btn:hover{border-color:var(--gold);transform:translateY(-1px);}
  .period-label{font-family:'Fraunces',serif;font-size:19px;font-weight:600;text-transform:capitalize;min-width:170px;text-align:center;}

  footer.note{margin-top:32px;text-align:center;color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace;}
  @media(max-width:520px){ .habit-col{min-width:130px;max-width:130px;} }

  /* TODAY VIEW */
  .today-head{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;}
  .today-strip{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;flex:1;}
  .today-jump{display:flex;gap:6px;align-items:center;flex:none;}
  .today-jump input[type=date]{background:var(--panel);border:1px solid var(--line);color:var(--parchment);padding:9px 10px;border-radius:var(--r-sm);font-size:12.5px;font-family:'Inter';outline:none;}
  .today-jump input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer;}
  .progress-ring-wrap{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .progress-ring-wrap svg{flex:none;}
  .pr-label{font-family:'Fraunces',serif;font-size:18px;font-weight:600;text-transform:capitalize;}
  .pr-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .tip-card{display:flex;align-items:flex-start;gap:11px;background:var(--gold-soft);border:1px solid var(--gold-dim);border-radius:var(--r-md);padding:13px 16px;margin-bottom:18px;font-size:13px;line-height:1.5;color:var(--parchment);}
  .tip-icon{font-size:17px;flex:none;line-height:1.3;}
  .day-chip{flex:none;width:54px;padding:9px 0;border-radius:var(--r-md);text-align:center;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.15s;}
  .day-chip:hover{border-color:var(--gold-dim);}
  .day-chip .dn{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;}
  .day-chip .dd{font-family:'Fraunces',serif;font-weight:700;font-size:17px;margin-top:2px;}
  .day-chip.sel{background:linear-gradient(135deg,var(--gold),var(--gold-dim));border-color:var(--gold);box-shadow:0 3px 12px rgba(0,0,0,.2);}
  .day-chip.sel .dn, .day-chip.sel .dd{color:var(--ink);}
  .day-chip.future{opacity:.35;cursor:default;}

  .habit-card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--habit-color,var(--gold));border-radius:var(--r-lg);padding:15px 17px;margin-bottom:11px;box-shadow:var(--shadow-sm);transition:.15s;}
  .habit-card:hover{box-shadow:var(--shadow);}
  .hc-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .hc-left{display:flex;align-items:center;gap:11px;overflow:hidden;}
  .hc-left .em{font-size:21px;flex:none;}
  .hc-left .info .nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hc-left .info .mt{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-top:2px;}
  .hc-actions{display:flex;gap:7px;flex:none;}
  .hc-btn{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);font-size:18px;cursor:pointer;color:var(--muted);transition:.15s;}
  .hc-btn:hover{transform:translateY(-1px);}
  .hc-btn.done-on{background:var(--done-dim);color:var(--done);border-color:var(--done);}
  .hc-btn.missed-on{background:var(--missed-dim);color:var(--missed);border-color:var(--missed);}
  .hc-note{margin-top:11px;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;color:var(--parchment);font-family:'Inter';resize:vertical;min-height:34px;outline:none;transition:.15s;}
  .hc-note:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
  .hc-note::placeholder{color:var(--muted);}

  .reorder-col{display:flex;flex-direction:column;gap:1px;}
  .reorder-col button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:10px;opacity:.5;line-height:1;padding:2px;}
  .reorder-col button:hover{opacity:1;}
  .habit-actions .edit:hover{color:var(--gold);}
  .habit-label{cursor:pointer;}
  .hc-left .info .nm{cursor:pointer;}
  .drag-handle{cursor:grab;color:var(--muted);flex:none;font-size:13px;opacity:.5;}
  .drag-handle:hover{opacity:1;}
  tr[draggable="true"]{transition:opacity .15s;}
  tr.dragging{opacity:.4;}
  tr.drag-over td{box-shadow:inset 0 2px 0 var(--gold);}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-overlay.hidden{display:none;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);max-width:420px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow);animation:panelIn .18s ease;}
  .modal-box h3{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .modal-close{position:sticky;top:0;float:right;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  .modal-close:hover{color:var(--missed);}
  .modal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0;}
  .modal-stats .ms{background:var(--panel-2);border-radius:var(--r-sm);padding:11px;text-align:center;}
  .modal-stats .ms .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:var(--gold);}
  .modal-stats .ms .l{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .mini-heat{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;margin-top:10px;}
  .mini-heat .hc{aspect-ratio:1;border-radius:2px;background:var(--panel-2);}
  .mini-heat .hc.miss{background:var(--missed-dim);}

  /* TOAST */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(6px);background:var(--panel);border:1px solid var(--gold);color:var(--parchment);padding:11px 18px;border-radius:var(--r-md);font-size:13px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="brand-mark">Libro de constancia</div>
      <h1>Hábitos</h1>
    </div>
    <div class="top-right">
      <div class="tabs">
        <button class="tab-btn active" data-tab="today">Hoy<span class="tab-badge" id="todayBadge"></span></button>
        <button class="tab-btn" data-tab="dash">Resumen</button>
        <button class="tab-btn" data-tab="week">Semana</button>

        <button class="tab-btn" data-tab="year">Año</button>
      </div>

  <div class="toolbar">

    <div class="add-grid">
      <input class="name" id="newName" type="text" placeholder="Nombre del hábito" maxlength="40">
      <input class="emoji" id="newEmoji" type="text" placeholder="🔹" maxlength="2">
      <div class="color-pick-wrap">
        <div class="swatches" id="swatches"></div>

          <input type="color" id="colorWheel" value="#C9A15A">

      <select id="newGoal">
        <option value="7">Todos los días</option>
        <option value="6">6 días / semana</option>
        <option value="5">5 días / semana</option>
        <option value="4">4 días / semana</option>
        <option value="3">3 días / semana</option>
        <option value="2">2 días / semana</option>
        <option value="1">1 día / semana</option>
      </select>
      <button class="save" id="saveHabit">Guardar</button>
      <button class="icon-btn" id="cancelEdit" style="display:none;">Cancelar</button>
    </div>
  </div>

  <div id="todayView">
    <div class="today-head">
      <div class="today-strip" id="todayStrip"></div>
      <div class="today-jump">
        <input type="date" id="dateJump">
        <button class="icon-btn" id="jumpToday">Hoy</button>
      </div>
    </div>
    <div id="todayContent"></div>
  </div>

  <div id="dashView" style="display:none;"></div>

  <div id="weekView" style="display:none;">
    <div class="nav-row">
      <button class="nav-btn" id="prevWeek">‹</button>
      <div class="period-label" id="weekLabel"></div>
      <button class="nav-btn" id="nextWeek">›</button>
    </div>
    <div id="weekContent"></div>
  </div>

  <div id="monthView" style="display:none;">
    <div class="nav-row">
      <button class="nav-btn" id="prevMonth">‹</button>
      <div class="period-label" id="monthLabel"></div>
      <button class="nav-btn" id="nextMonth">›</button>
    </div>
    <div id="monthContent"></div>
  </div>

  <div id="yearView" style="display:none;">
    <div class="nav-row">
      <button class="nav-btn" id="prevYear">‹</button>
      <div class="period-label" id="yearLabel"></div>
      <button class="nav-btn" id="nextYear">›</button>
    </div>
    <div id="yearContent"></div>
  </div>

  <footer class="note">tap una celda: vacío → ✓ → ✕ → vacío</footer>
</div>

<div class="modal-overlay hidden" id="detailModal">
  <div class="modal-box" id="detailModalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const STORAGE_KEY = "habit-tracker-data";
const PALETTE = ["#C9A15A","#5B8266","#6E8FB5","#B5533C","#9A6FB0","#4FA3A3"];

let state = { habits: [], entries: {}, notes: {}, tipQueue: [], tipLastDate: "", tipTodayIndex: null,
  allDoneQueue: [], allDoneLastDate: "", allDoneTodayIndex: null,
  missedQueue: [], missedLastDate: "", missedTodayIndex: null,
  zeroQueue: [], zeroLastDate: "", zeroTodayIndex: null };
let cursorMonth = new Date();
let cursorYear = new Date().getFullYear();
let cursorWeek = startOfWeek(new Date());
let currentTab = "today";
let selectedColor = PALETTE[0];
let searchTerm = "";
let categoryFilter = "";
let selectedDay = new Date();
let editingId = null;

function startOfWeek(d){
  const x = new Date(d);
  const dow = x.getDay();
  const diff = dow===0 ? -6 : 1-dow;
  x.setDate(x.getDate()+diff);
  x.setHours(0,0,0,0);
  return x;
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2600);
}

function pad(n){return n.toString().padStart(2,"0");}
function dateKey(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`;}
function todayKey(){const t=new Date();return dateKey(t.getFullYear(),t.getMonth(),t.getDate());}
function activeHabits(){return state.habits.filter(h=>!h.archived);}
function visibleHabits(){
  return activeHabits().filter(h=>
    h.name.toLowerCase().includes(searchTerm.toLowerCase()) &&
    (!categoryFilter || h.category===categoryFilter)
  );
}
function allCategories(){
  return Array.from(new Set(activeHabits().map(h=>h.category).filter(Boolean))).sort();
}

async function loadState(){
  try{
    if(window.storage){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value) applyLoadedData(res.value);
      return;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) applyLoadedData(raw);
  }catch(e){}
}
function applyLoadedData(raw){
  const parsed = JSON.parse(raw);
  state.habits = (parsed.habits||[]).map(h=>({emoji:"🔹",color:PALETTE[0],goal:7,archived:false,category:"",reminderTime:"",...h}));
  state.entries = parsed.entries || {};
  state.notes = parsed.notes || {};
  state.tipQueue = Array.isArray(parsed.tipQueue) ? parsed.tipQueue : [];
  state.tipLastDate = parsed.tipLastDate || "";
  state.tipTodayIndex = typeof parsed.tipTodayIndex==="number" ? parsed.tipTodayIndex : null;
  state.allDoneQueue = Array.isArray(parsed.allDoneQueue) ? parsed.allDoneQueue : [];
  state.allDoneLastDate = parsed.allDoneLastDate || "";
  state.allDoneTodayIndex = typeof parsed.allDoneTodayIndex==="number" ? parsed.allDoneTodayIndex : null;
  state.missedQueue = Array.isArray(parsed.missedQueue) ? parsed.missedQueue : [];
  state.missedLastDate = parsed.missedLastDate || "";
  state.missedTodayIndex = typeof parsed.missedTodayIndex==="number" ? parsed.missedTodayIndex : null;
  state.zeroQueue = Array.isArray(parsed.zeroQueue) ? parsed.zeroQueue : [];
  state.zeroLastDate = parsed.zeroLastDate || "";
  state.zeroTodayIndex = typeof parsed.zeroTodayIndex==="number" ? parsed.zeroTodayIndex : null;
}
async function saveState(){
  const json = JSON.stringify(state);
  try{
    if(window.storage){ await window.storage.set(STORAGE_KEY, json, false); return; }
  }catch(e){ console.error("No se pudo guardar en window.storage", e); }
  try{ localStorage.setItem(STORAGE_KEY, json); }
  catch(e){ console.error("No se pudo guardar localmente", e); }
}
function uid(){return 'h'+Math.random().toString(36).slice(2,9);}
function escapeHtml(str){const div=document.createElement("div");div.textContent=str;return div.innerHTML;}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = todayKey();
  a.href = url; a.download = `habitos-respaldo-${stamp}.json`; a.click();
  URL.revokeObjectURL(url);
  try{ localStorage.setItem("habit_last_backup", new Date().toISOString()); }catch(e){}
  render();
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.habits) throw new Error("formato inválido");
      if(state.habits.length){
        const merge = confirm("¿Quieres COMBINAR el respaldo con tus datos actuales?\n\nAceptar = combinar (conserva ambos)\nCancelar = reemplazar todo por el respaldo");
        if(merge) mergeBackup(parsed);
        else{
          if(!confirm("Esto reemplazará todos los datos actuales de este dispositivo con el respaldo. ¿Continuar?")) return;
          applyLoadedData(JSON.stringify(parsed));
        }
      } else {
        applyLoadedData(JSON.stringify(parsed));
      }
      saveState();
      try{ localStorage.setItem("habit_last_backup", new Date().toISOString()); }catch(err2){}
      render();
      toast("Respaldo importado ✓");
    }catch(err){ alert("No se pudo leer el archivo de respaldo."); }
  };
  reader.readAsText(file);
}
function mergeBackup(parsed){
  const incoming = (parsed.habits||[]).map(h=>({emoji:"🔹",color:PALETTE[0],goal:7,archived:false,category:"",reminderTime:"",...h}));
  incoming.forEach(ih=>{
    const local = state.habits.find(lh=>lh.name.toLowerCase()===ih.name.toLowerCase());
    if(local){
      const inEntries = (parsed.entries && parsed.entries[ih.id]) || {};
      if(!state.entries[local.id]) state.entries[local.id] = {};
      Object.keys(inEntries).forEach(k=>{ if(!state.entries[local.id][k]) state.entries[local.id][k] = inEntries[k]; });
      const inNotes = (parsed.notes && parsed.notes[ih.id]) || {};
      if(!state.notes[local.id]) state.notes[local.id] = {};
      Object.keys(inNotes).forEach(k=>{ if(!state.notes[local.id][k]) state.notes[local.id][k] = inNotes[k]; });
    } else {
      const newId = uid();
      state.habits.push({...ih, id:newId});
      state.entries[newId] = (parsed.entries && parsed.entries[ih.id]) || {};
      state.notes[newId] = (parsed.notes && parsed.notes[ih.id]) || {};
    }
  });
}

function addHabit(name, emoji, color, goal, category, reminderTime){
  name = name.trim();
  if(!name) return;
  const dup = activeHabits().some(h=>h.name.toLowerCase()===name.toLowerCase());
  if(dup && !confirm(`Ya existe un hábito llamado "${name}". ¿Agregarlo de todas formas?`)) return;
  state.habits.push({id:uid(), name, emoji: emoji||"🔹", color, goal, archived:false, category: (category||"").trim(), reminderTime: reminderTime||""});
  saveState(); render();
  toast("Hábito agregado ✓");
}
function updateHabit(id, name, emoji, color, goal, category, reminderTime){
  const h = state.habits.find(x=>x.id===id);
  if(!h) return;
  name = name.trim();
  if(!name) return;
  h.name=name; h.emoji=emoji||"🔹"; h.color=color; h.goal=goal;
  h.category=(category||"").trim(); h.reminderTime=reminderTime||"";
  saveState(); render();
  toast("Hábito actualizado ✓");
}
function openEditHabit(id){
  const h = state.habits.find(x=>x.id===id);
  if(!h) return;
  editingId = id;
  document.getElementById("newName").value = h.name;
  document.getElementById("newEmoji").value = h.emoji;
  document.getElementById("newCategory").value = h.category||"";
  document.getElementById("newReminder").value = h.reminderTime||"";
  document.getElementById("newGoal").value = h.goal;
  selectedColor = h.color;
  document.getElementById("colorWheel").value = h.color;
  document.querySelectorAll("#swatches .swatch").forEach(s=>s.classList.toggle("sel", s.dataset.color===h.color));
  document.getElementById("addPanelTitle").textContent = "Editar hábito";
  document.getElementById("saveHabit").textContent = "Guardar cambios";
  document.getElementById("cancelEdit").style.display = "";
  document.getElementById("addPanel").classList.add("open");
  document.getElementById("newName").scrollIntoView({behavior:"smooth", block:"center"});
}
function resetAddPanel(){
  editingId = null;
  document.getElementById("newName").value = "";
  document.getElementById("newEmoji").value = "";
  document.getElementById("newCategory").value = "";
  document.getElementById("newReminder").value = "";
  document.getElementById("addPanelTitle").textContent = "Nuevo hábito";
  document.getElementById("saveHabit").textContent = "Guardar";
  document.getElementById("cancelEdit").style.display = "none";
  document.getElementById("addPanel").classList.remove("open");
  selectedColor = PALETTE[0];
  document.getElementById("colorWheel").value = PALETTE[0];
  document.querySelectorAll("#swatches .swatch").forEach((s,i)=>s.classList.toggle("sel", i===0));
}
function archiveHabit(id){ const h=state.habits.find(x=>x.id===id); if(h){h.archived=true; saveState(); render();} }
function restoreHabit(id){ const h=state.habits.find(x=>x.id===id); if(h){h.archived=false; saveState(); render();} }
function deleteHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  delete state.entries[id];
  saveState(); render();
}
function cycleStatus(habitId, key){
  if(key > todayKey()) return;
  if(!state.entries[habitId]) state.entries[habitId] = {};
  const cur = state.entries[habitId][key];
  let next = !cur ? "done" : (cur==="done" ? "missed" : undefined);
  if(next) state.entries[habitId][key] = next; else delete state.entries[habitId][key];
  saveState(); render();
  if(key===todayKey()) checkPerfectDay();
}
function getStatus(habitId, key){ return (state.entries[habitId] && state.entries[habitId][key]) || null; }

function setStatus(habitId, key, status){
  if(key > todayKey()) return;
  if(!state.entries[habitId]) state.entries[habitId] = {};
  const cur = state.entries[habitId][key];
  if(cur===status) delete state.entries[habitId][key];
  else state.entries[habitId][key] = status;
  saveState(); render();
  if(key===todayKey()) checkPerfectDay();
}
function checkPerfectDay(){
  const habits = activeHabits();
  if(!habits.length) return;
  const k = todayKey();
  const allDone = habits.every(h=>getStatus(h.id,k)==="done");
  let already = false;
  try{ already = localStorage.getItem("habit_confetti_"+k)==="1"; }catch(e){}
  if(allDone && !already){
    launchConfetti();
    try{ localStorage.setItem("habit_confetti_"+k,"1"); }catch(e){}
    toast("¡Día perfecto! 🎉");
  }
}
function launchConfetti(){
  const colors = PALETTE;
  for(let i=0;i<60;i++){
    const p = document.createElement("div");
    const c = colors[Math.floor(Math.random()*colors.length)];
    const size = 6+Math.random()*6;
    p.style.cssText = `position:fixed;top:-20px;left:${Math.random()*100}vw;width:${size}px;height:${size*0.6}px;background:${c};z-index:99;border-radius:2px;opacity:${.7+Math.random()*.3};transform:rotate(${Math.random()*360}deg);pointer-events:none;`;
    document.body.appendChild(p);
    const duration = 1800+Math.random()*1400;
    const drift = (Math.random()-0.5)*160;
    const anim = p.animate([
      {transform:`translate(0,0) rotate(0deg)`, opacity:1},
      {transform:`translate(${drift}px, 100vh) rotate(${360+Math.random()*360}deg)`, opacity:0.9}
    ], {duration, easing:"cubic-bezier(.25,.46,.45,.94)"});
    anim.onfinish = ()=>p.remove();
  }
}
function getNote(habitId, key){ return (state.notes[habitId] && state.notes[habitId][key]) || ""; }
function setNote(habitId, key, text){
  if(!state.notes[habitId]) state.notes[habitId] = {};
  if(text.trim()) state.notes[habitId][key] = text;
  else delete state.notes[habitId][key];
  saveState();
}
function moveHabit(id, dir){
  const idx = state.habits.findIndex(h=>h.id===id);
  const swap = idx+dir;
  if(idx<0 || swap<0 || swap>=state.habits.length) return;
  [state.habits[idx], state.habits[swap]] = [state.habits[swap], state.habits[idx]];
  saveState(); render();
}
function applyTheme(mode){
  document.documentElement.classList.toggle("light", mode==="light");
  document.getElementById("themeBtn").textContent = mode==="light" ? "☀️" : "🌙";
  try{ localStorage.setItem("habit_theme", mode); }catch(e){}
}

function computeStreaks(habitId){
  const entries = state.entries[habitId] || {};
  const dates = Object.keys(entries).filter(k=>entries[k]==="done").sort();
  if(dates.length===0) return {current:0, best:0};
  let best=1, run=1;
  for(let i=1;i<dates.length;i++){
    const diff = (new Date(dates[i]) - new Date(dates[i-1]))/86400000;
    run = diff===1 ? run+1 : 1;
    if(run>best) best=run;
  }
  let current=0, d=new Date();
  while(true){
    const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    if(entries[k]==="done"){ current++; d.setDate(d.getDate()-1); }
    else if(k===todayKey()){ d.setDate(d.getDate()-1); continue; }
    else break;
  }
  return {current, best};
}

function showDetail(id){
  const h = state.habits.find(x=>x.id===id);
  if(!h) return;
  const entries = state.entries[id] || {};
  const doneTotal = Object.values(entries).filter(s=>s==="done").length;
  const missedTotal = Object.values(entries).filter(s=>s==="missed").length;
  const {current, best} = computeStreaks(id);
  const now = new Date();
  const pctMonth = monthCompletion(id, now.getFullYear(), now.getMonth());

  const days = [];
  for(let i=83; i>=0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    days.push(dateKey(d.getFullYear(), d.getMonth(), d.getDate()));
  }
  let heat = `<div class="mini-heat">`;
  days.forEach(k=>{
    const s = entries[k];
    heat += `<div class="hc ${s==='missed'?'miss':''}" style="${s==='done'?`background:${h.color}`:''}" title="${k}${s?': '+(s==='done'?'✓':'✕'):''}"></div>`;
  });
  heat += `</div>`;

  const box = document.getElementById("detailModalBox");
  box.innerHTML = `
    <button class="modal-close" id="closeDetail">✕</button>
    <h3><span>${h.emoji}</span> ${escapeHtml(h.name)}</h3>
    <div style="font-size:12px;color:var(--muted);">${h.goal===7?'Todos los días':h.goal+' días/semana'}${h.category?' · '+escapeHtml(h.category):''}${h.reminderTime?' · ⏰ '+h.reminderTime:''}</div>
    <div class="modal-stats">
      <div class="ms"><div class="n">${current}</div><div class="l">Racha actual</div></div>
      <div class="ms"><div class="n">${best}</div><div class="l">Mejor racha</div></div>
      <div class="ms"><div class="n">${pctMonth}%</div><div class="l">Este mes</div></div>
      <div class="ms"><div class="n">${doneTotal}</div><div class="l">Total cumplidos</div></div>
      <div class="ms"><div class="n">${missedTotal}</div><div class="l">Total fallados</div></div>
      <div class="ms"><div class="n">${badgeLevel(best)>=1?'🥉'.repeat(1):'—'}${badgeLevel(best)>=2?' 🥈':''}${badgeLevel(best)>=3?' 🥇':''}</div><div class="l">Logros</div></div>
    </div>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:2px;">Últimos 84 días</div>
    ${heat}
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="icon-btn" id="detailEdit" style="flex:1;">✎ Editar</button>
      <button class="icon-btn" id="detailArchive" style="flex:1;">📦 ${h.archived?'Restaurar':'Archivar'}</button>
    </div>`;
  document.getElementById("detailModal").classList.remove("hidden");
  document.getElementById("closeDetail").addEventListener("click", closeDetail);
  document.getElementById("detailEdit").addEventListener("click", ()=>{ closeDetail(); openEditHabit(id); });
  document.getElementById("detailArchive").addEventListener("click", ()=>{ closeDetail(); h.archived ? restoreHabit(id) : archiveHabit(id); });
}
function closeDetail(){ document.getElementById("detailModal").classList.add("hidden"); }

function monthCompletion(habitId, y, m){
  const h = state.habits.find(x=>x.id===habitId);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = new Date();
  const isCurrentMonth = today.getFullYear()===y && today.getMonth()===m;
  const isFutureMonth = new Date(y,m,1) > today;
  const lastDay = isFutureMonth ? 0 : (isCurrentMonth ? today.getDate() : daysInMonth);
  if(lastDay<=0) return 0;
  let done=0;
  for(let d=1; d<=lastDay; d++){ if(getStatus(habitId, dateKey(y,m,d))==="done") done++; }
  const goal = h ? h.goal : 7;
  const expected = Math.max(1, Math.round((goal/7)*lastDay));
  return Math.min(100, Math.round((done/expected)*100));
}

function trendCardHtml(habits){
  const now = new Date();
  const months = [];
  for(let i=5; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({y:d.getFullYear(), m:d.getMonth()});
  }
  const avgs = months.map(({y,m})=>{
    if(!habits.length) return 0;
    return Math.round(habits.reduce((s,h)=>s+monthCompletion(h.id,y,m),0)/habits.length);
  });
  let bars = `<div class="bar-chart" style="height:70px;">`;
  avgs.forEach(p=>{
    const cls = p===100?"full":(p===0?"zero":"");
    bars += `<div class="bar-col" title="${p}%"><div class="bar-fill ${cls}" style="height:${Math.max(p,3)}%"></div></div>`;
  });
  bars += `</div><div class="bar-axis">`;
  months.forEach(({m})=>{ bars += `<span>${MONTHS[m].slice(0,3)}</span>`; });
  bars += `</div>`;
  return `<div class="chart-card" style="margin-bottom:16px;"><h4>Tendencia · últimos 6 meses</h4>${bars}</div>`;
}

function badgeLevel(bestStreak){
  if(bestStreak>=100) return 3;
  if(bestStreak>=30) return 2;
  if(bestStreak>=7) return 1;
  return 0;
}

function backupBannerHtml(){
  let last = null;
  try{ last = localStorage.getItem("habit_last_backup"); }catch(e){}
  const daysSince = last ? Math.floor((Date.now()-new Date(last).getTime())/86400000) : null;
  const needsBackup = daysSince===null || daysSince>=7;
  if(!needsBackup) return "";
  const msg = daysSince===null ? "Nunca has descargado un respaldo." : `Tu último respaldo fue hace ${daysSince} días.`;
  return `<div class="backup-banner">
    <span>⚠️ ${msg} Tus datos viven en este navegador/cuenta — si cambias de teléfono sin respaldo, los pierdes.</span>
    <button class="icon-btn" onclick="exportBackup()">💾 Respaldar ahora</button>
  </div>`;
}

function renderTabs(){
  document.querySelectorAll(".tab-btn").forEach(btn=>btn.classList.toggle("active", btn.dataset.tab===currentTab));
  document.getElementById("todayView").style.display = currentTab==="today" ? "" : "none";
  document.getElementById("dashView").style.display = currentTab==="dash" ? "" : "none";
  document.getElementById("weekView").style.display = currentTab==="week" ? "" : "none";
  document.getElementById("monthView").style.display = currentTab==="month" ? "" : "none";
  document.getElementById("yearView").style.display = currentTab==="year" ? "" : "none";
  const todayStr = todayKey();
  const pending = activeHabits().filter(h=>!getStatus(h.id,todayStr)).length;
  const badge = document.getElementById("todayBadge");
  if(badge) badge.textContent = pending>0 ? pending : "";
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function getNextTipIndex(){
  // Cola barajada persistente: cada índice de TIPS se consume una vez
  // antes de volver a barajar y repetir. Nunca se repite un tip hasta
  // que todos los demás ya salieron.
  if(!Array.isArray(state.tipQueue) || state.tipQueue.length===0){
    state.tipQueue = shuffle(TIPS.map((_,i)=>i));
  }
  const idx = state.tipQueue.shift();
  saveState();
  return idx;
}
function getNextFromQueue(queueField, list){
  // Mismo mecanismo de cola barajada, reutilizado para las variantes
  // de "día completo", "día difícil" y "racha en cero".
  if(!Array.isArray(state[queueField]) || state[queueField].length===0){
    state[queueField] = shuffle(list.map((_,i)=>i));
  }
  const idx = state[queueField].shift();
  saveState();
  return idx;
}
function getTodayTip(habits, selKey, todayStr){
  if(selKey!==todayStr) return null;
  const allDone = habits.length && habits.every(h=>getStatus(h.id,selKey)==="done");
  if(allDone){
    if(state.allDoneLastDate !== todayStr){
      state.allDoneLastDate = todayStr;
      state.allDoneTodayIndex = getNextFromQueue("allDoneQueue", ALLDONE_TIPS);
    }
    return {icon:"🎉", text: ALLDONE_TIPS[state.allDoneTodayIndex] || ALLDONE_TIPS[0]};
  }
  const missedCount = habits.filter(h=>getStatus(h.id,selKey)==="missed").length;
  if(missedCount >= Math.ceil(habits.length/2) && habits.length>1){
    if(state.missedLastDate !== todayStr){
      state.missedLastDate = todayStr;
      state.missedTodayIndex = getNextFromQueue("missedQueue", MISSEDMANY_TIPS);
    }
    return {icon:"💛", text: MISSEDMANY_TIPS[state.missedTodayIndex] || MISSEDMANY_TIPS[0]};
  }
  let worstStreak=null;
  habits.forEach(h=>{ const {current}=computeStreaks(h.id); if(current===0 && (worstStreak===null)) worstStreak=h; });
  if(worstStreak){
    if(state.zeroLastDate !== todayStr){
      state.zeroLastDate = todayStr;
      state.zeroTodayIndex = getNextFromQueue("zeroQueue", ZEROSTREAK_TIPS);
    }
    const fn = ZEROSTREAK_TIPS[state.zeroTodayIndex] || ZEROSTREAK_TIPS[0];
    return {icon:"🔄", text: fn(worstStreak.name)};
  }
  if(state.tipLastDate !== todayStr){
    state.tipLastDate = todayStr;
    state.tipTodayIndex = getNextTipIndex();
  }
  const tip = TIPS[state.tipTodayIndex] || TIPS[0];
  return {icon:"💡", text: tip};
}

function renderToday(){
  const strip = document.getElementById("todayStrip");
  const content = document.getElementById("todayContent");
  const habits = visibleHabits();
  const dowShort = ["D","L","M","M","J","V","S"];
  const todayStr = todayKey();
  const selKey = dateKey(selectedDay.getFullYear(), selectedDay.getMonth(), selectedDay.getDate());

  let stripHtml = "";
  for(let i=6; i>=0; i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    stripHtml += `<div class="day-chip ${k===selKey?'sel':''}" data-day="${k}">
      <div class="dn">${dowShort[d.getDay()]}</div><div class="dd">${d.getDate()}</div>
    </div>`;
  }
  strip.innerHTML = stripHtml;
  strip.querySelectorAll(".day-chip").forEach(chip=>chip.addEventListener("click", ()=>{
    selectedDay = new Date(chip.dataset.day+"T00:00:00");
    render();
  }));
  document.getElementById("dateJump").value = selKey;
  document.getElementById("dateJump").max = todayStr;

  if(activeHabits().length===0){
    content.innerHTML = `<div class="empty"><b>Tu libro está vacío.</b><br>Agrega tu primer hábito arriba para empezar.</div>`;
    return;
  }
  if(habits.length===0){
    content.innerHTML = `<div class="empty">Sin resultados para "${escapeHtml(searchTerm)}".</div>`;
    return;
  }

  const label = selKey===todayStr ? "Hoy" : new Date(selKey+"T00:00:00").toLocaleDateString("es-CL",{weekday:'long', day:'numeric', month:'long'});
  const doneCount = habits.filter(h=>getStatus(h.id,selKey)==="done").length;
  const pct = habits.length ? Math.round((doneCount/habits.length)*100) : 0;
  const R = 30, C = 2*Math.PI*R;
  const ringColor = pct===100 ? "var(--done)" : "var(--gold)";
  let html = `<div class="progress-ring-wrap">
    <svg width="72" height="72" viewBox="0 0 72 72">
      <circle cx="36" cy="36" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="8"/>
      <circle cx="36" cy="36" r="${R}" fill="none" stroke="${ringColor}" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C - (pct/100)*C}" transform="rotate(-90 36 36)" style="transition:stroke-dashoffset .4s ease;"/>
      <text x="36" y="41" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="var(--parchment)">${pct}%</text>
    </svg>
    <div><div class="pr-label">${label}</div><div class="pr-sub">${doneCount} de ${habits.length} hábitos cumplidos</div></div>
  </div>`;

  const tip = getTodayTip(habits, selKey, todayStr);
  if(tip) html += `<div class="tip-card"><span class="tip-icon">${tip.icon}</span><span>${escapeHtml(tip.text)}</span></div>`;

  habits.forEach(h=>{
    const s = getStatus(h.id, selKey);
    const note = getNote(h.id, selKey);
    html += `<div class="habit-card" style="--habit-color:${h.color}">
      <div class="hc-top">
        <div class="hc-left"><span class="em">${h.emoji}</span>
          <div class="info"><div class="nm" data-detail="${h.id}">${escapeHtml(h.name)}</div><div class="mt">${h.goal===7?'diario':h.goal+'x/sem'}${h.category?' · '+escapeHtml(h.category):''}</div></div>
        </div>
        <div class="hc-actions">
          <button class="hc-btn ${s==='done'?'done-on':''}" data-act="done" data-habit="${h.id}">✓</button>
          <button class="hc-btn ${s==='missed'?'missed-on':''}" data-act="missed" data-habit="${h.id}">✕</button>
        </div>
      </div>
      <textarea class="hc-note" data-note="${h.id}" placeholder="Agregar nota...">${escapeHtml(note)}</textarea>
    </div>`;
  });
  content.innerHTML = html;

  content.querySelectorAll("[data-act]").forEach(btn=>btn.addEventListener("click", ()=>setStatus(btn.dataset.habit, selKey, btn.dataset.act)));
  content.querySelectorAll("[data-note]").forEach(ta=>ta.addEventListener("change", ()=>setNote(ta.dataset.note, selKey, ta.value)));
  content.querySelectorAll("[data-detail]").forEach(el=>el.addEventListener("click", ()=>showDetail(el.dataset.detail)));
}

function renderDash(){
  const container = document.getElementById("dashView");
  const habits = activeHabits();
  if(habits.length===0){
    container.innerHTML = `<div class="empty"><b>Tu libro está vacío.</b><br>Agrega tu primer hábito para ver tu resumen.</div>`;
    return;
  }
  const y = new Date().getFullYear(), m = new Date().getMonth();
  const avgPct = Math.round(habits.reduce((s,h)=>s+monthCompletion(h.id,y,m),0)/habits.length);
  let currentBestActive = 0;
  habits.forEach(h=>{ const {current} = computeStreaks(h.id); if(current>currentBestActive) currentBestActive=current; });

  const today = new Date().getDate();
  let perfectDays = 0;
  for(let d=1; d<=today; d++){
    const k = dateKey(y,m,d);
    if(habits.every(h=>getStatus(h.id,k)==="done")) perfectDays++;
  }

  let perfectStreak=0, dCur=new Date();
  while(true){
    const k = dateKey(dCur.getFullYear(), dCur.getMonth(), dCur.getDate());
    const allDone = habits.every(h=>getStatus(h.id,k)==="done");
    if(allDone){ perfectStreak++; dCur.setDate(dCur.getDate()-1); }
    else if(k===todayKey()){ dCur.setDate(dCur.getDate()-1); continue; }
    else break;
  }
  const totalDoneAll = habits.reduce((s,h)=>s+Object.values(state.entries[h.id]||{}).filter(v=>v==="done").length,0);

  let html = backupBannerHtml();
  html += `<div class="kpi-row">
    <div class="kpi-card"><div class="num">${habits.length}</div><div class="lbl">Hábitos activos</div></div>
    <div class="kpi-card"><div class="num">${avgPct}%</div><div class="lbl">Cumplimiento del mes</div></div>
    <div class="kpi-card"><div class="num">${currentBestActive}</div><div class="lbl">Mejor racha activa</div></div>
    <div class="kpi-card"><div class="num">${perfectDays}</div><div class="lbl">Días perfectos (mes)</div></div>
    <div class="kpi-card"><div class="num">${perfectStreak}</div><div class="lbl">Racha perfecta actual</div></div>
    <div class="kpi-card"><div class="num">${totalDoneAll}</div><div class="lbl">Total cumplidos</div></div>
  </div>`;

  html += `<div class="badges-card"><h4>Logros por racha (🥉7 · 🥈30 · 🥇100 días)</h4>`;
  habits.slice().sort((a,b)=>computeStreaks(b.id).best-computeStreaks(a.id).best).forEach(h=>{
    const {best} = computeStreaks(h.id);
    const lvl = badgeLevel(best);
    html += `<div class="badge-row">
      <div class="badge-name" data-detail="${h.id}" style="cursor:pointer;"><span>${h.emoji}</span><span class="tx">${escapeHtml(h.name)}</span></div>
      <div class="badge-medals">
        <span class="${lvl>=1?'':'off'}">🥉</span><span class="${lvl>=2?'':'off'}">🥈</span><span class="${lvl>=3?'':'off'}">🥇</span>
      </div>
    </div>`;
  });
  html += `</div>`;

  html += trendCardHtml(habits);

  const archived = state.habits.filter(h=>h.archived);
  if(archived.length){
    html += `<div class="archived-list"><b style="color:var(--parchment)">Archivados</b>`;
    archived.forEach(h=>{
      html += `<div class="archived-item"><span>${h.emoji} ${escapeHtml(h.name)}</span><button data-restore="${h.id}">Restaurar</button></div>`;
    });
    html += `</div>`;
  }

  container.innerHTML = html;
  container.querySelectorAll("[data-restore]").forEach(btn=>btn.addEventListener("click", ()=>restoreHabit(btn.dataset.restore)));
  container.querySelectorAll("[data-detail]").forEach(el=>el.addEventListener("click", ()=>showDetail(el.dataset.detail)));
}

function renderMonth(){
  const y = cursorMonth.getFullYear(), m = cursorMonth.getMonth();
  document.getElementById("monthLabel").textContent = `${MONTHS[m]} ${y}`;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const container = document.getElementById("monthContent");
  const habits = visibleHabits();

  if(activeHabits().length===0){
    container.innerHTML = `<div class="empty"><b>Aún no hay hábitos.</b><br>Agrega el primero arriba para empezar tu libro.</div>`;
    return;
  }
  if(habits.length===0){
    container.innerHTML = `<div class="empty">Sin resultados para "${escapeHtml(searchTerm)}".</div>`;
    return;
  }

  const todayStr = todayKey();
  const dayPcts = [];
  for(let d=1; d<=daysInMonth; d++){
    const k = dateKey(y,m,d);
    if(k > todayStr){ dayPcts.push(null); continue; }
    let done=0;
    habits.forEach(h=>{ if(getStatus(h.id,k)==="done") done++; });
    dayPcts.push(habits.length ? Math.round((done/habits.length)*100) : 0);
  }
  let barsHtml = `<div class="bar-chart">`;
  dayPcts.forEach(p=>{
    if(p===null) barsHtml += `<div class="bar-col"><div class="bar-fill zero" style="height:2px"></div></div>`;
    else{ const cls = p===100?"full":(p===0?"zero":""); barsHtml += `<div class="bar-col" title="${p}%"><div class="bar-fill ${cls}" style="height:${Math.max(p,3)}%"></div></div>`; }
  });
  barsHtml += `</div><div class="bar-axis">`;
  for(let d=1; d<=daysInMonth; d++){ barsHtml += `<span>${(d%5===0||d===1)?d:''}</span>`; }
  barsHtml += `</div>`;

  let progHtml = "";
  habits.slice().sort((a,b)=>monthCompletion(b.id,y,m)-monthCompletion(a.id,y,m)).forEach(h=>{
    const pct = monthCompletion(h.id,y,m);
    progHtml += `<div class="prog-item">
      <div class="prog-top"><span class="pname"><span class="dot" style="background:${h.color}"></span>${escapeHtml(h.name)}</span><span class="pval">${pct}%</span></div>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${h.color}"></div></div>
    </div>`;
  });

  let html = `<div class="analytics">
    <div class="chart-card"><h4>Cumplimiento diario</h4>${barsHtml}</div>
    <div class="progress-card"><h4>Progreso del mes</h4>${progHtml}</div>
  </div>`;

  html += `<div class="ledger"><table class="grid"><thead><tr><th class="habit-col">Hábito</th>`;
  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(y,m,d).getDay();
    html += `<th class="${dow===0?"dow-sun":dow===6?"dow-sat":""}">${d}</th>`;
  }
  html += `<th class="pct-col">%</th></tr></thead><tbody>`;

  habits.forEach(h=>{
    const goalTxt = h.goal===7 ? "diario" : `${h.goal}x/sem`;
    html += `<tr draggable="true" data-row="${h.id}"><td class="habit-col" style="--habit-color:${h.color}">
      <div class="habit-name-row">
        <div class="habit-label" data-detail="${h.id}"><span class="drag-handle" title="Arrastrar para reordenar">⠿</span><span class="em">${h.emoji}</span><span class="tx">${escapeHtml(h.name)}</span></div>
        <div class="habit-actions">
          <div class="reorder-col"><button data-up="${h.id}" title="Subir">▲</button><button data-down="${h.id}" title="Bajar">▼</button></div>
          <button class="edit" data-edit="${h.id}" title="Editar">✎</button>
          <button class="arc" data-arc="${h.id}" title="Archivar">📦</button>
          <button class="del" data-del="${h.id}" title="Eliminar">✕</button>
        </div>
      </div>
      <div class="habit-meta">${goalTxt}${h.category?` · ${escapeHtml(h.category)}`:''}${h.reminderTime?` · ⏰ ${h.reminderTime}`:''}</div>
    </td>`;
    for(let d=1; d<=daysInMonth; d++){
      const k = dateKey(y,m,d);
      const s = getStatus(h.id,k);
      const isFuture = k > todayStr;
      let cls = "cell" + (isFuture?" future":s==="done"?" done":s==="missed"?" missed":"");
      const content = s==="done"?"✓":s==="missed"?"✕":"";
      html += `<td class="${cls}" data-habit="${h.id}" data-key="${k}">${content}</td>`;
    }
    html += `<td class="pct-col">${monthCompletion(h.id,y,m)}%</td></tr>`;
  });
  html += `</tbody></table></div>`;

  html += `<div class="legend">
    <span><i class="sw" style="background:var(--done-dim);color:var(--done)"></i>✓ cumplido</span>
    <span><i class="sw" style="background:var(--missed-dim)"></i>✕ fallado</span>
    <span><i class="sw" style="background:var(--panel-2)"></i>sin marcar</span>
  </div>`;

  container.innerHTML = html;
  container.querySelectorAll("td.cell:not(.future)").forEach(td=>td.addEventListener("click", ()=>cycleStatus(td.dataset.habit, td.dataset.key)));
  container.querySelectorAll("[data-del]").forEach(btn=>btn.addEventListener("click", (e)=>{ e.stopPropagation(); if(confirm("¿Eliminar este hábito y todo su historial? Esta acción no se puede deshacer.")) deleteHabit(btn.dataset.del); }));
  container.querySelectorAll("[data-arc]").forEach(btn=>btn.addEventListener("click", (e)=>{ e.stopPropagation(); archiveHabit(btn.dataset.arc); }));
  container.querySelectorAll("[data-up]").forEach(btn=>btn.addEventListener("click", (e)=>{ e.stopPropagation(); moveHabit(btn.dataset.up, -1); }));
  container.querySelectorAll("[data-down]").forEach(btn=>btn.addEventListener("click", (e)=>{ e.stopPropagation(); moveHabit(btn.dataset.down, 1); }));
  container.querySelectorAll("[data-edit]").forEach(btn=>btn.addEventListener("click", (e)=>{ e.stopPropagation(); openEditHabit(btn.dataset.edit); }));
  container.querySelectorAll("[data-detail]").forEach(el=>el.addEventListener("click", (e)=>{ e.stopPropagation(); showDetail(el.dataset.detail); }));
  enableRowDrag(container);
}

function renderWeek(){
  const start = cursorWeek;
  const end = new Date(start); end.setDate(end.getDate()+6);
  const fmt = d=>d.toLocaleDateString("es-CL",{day:'numeric',month:'short'});
  document.getElementById("weekLabel").textContent = `${fmt(start)} – ${fmt(end)}`;
  const container = document.getElementById("weekContent");
  const habits = visibleHabits();

  if(activeHabits().length===0){
    container.innerHTML = `<div class="empty"><b>Aún no hay hábitos.</b><br>Agrega el primero arriba para ver tu semana.</div>`;
    return;
  }
  if(habits.length===0){
    container.innerHTML = `<div class="empty">Sin resultados para "${escapeHtml(searchTerm)}".</div>`;
    return;
  }

  const dowShort = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const todayStr = todayKey();
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); days.push(d); }

  let html = `<div class="ledger"><table class="grid"><thead><tr><th class="habit-col">Hábito</th>`;
  days.forEach((d,i)=>{ html += `<th class="${i===5?'dow-sat':i===6?'dow-sun':''}">${dowShort[i]}<br>${d.getDate()}</th>`; });
  html += `<th class="pct-col">%</th></tr></thead><tbody>`;

  habits.forEach(h=>{
    const goalTxt = h.goal===7 ? "diario" : `${h.goal}x/sem`;
    let done=0, counted=0;
    html += `<tr><td class="habit-col" style="--habit-color:${h.color}">
      <div class="habit-name-row">
        <div class="habit-label" data-detail="${h.id}"><span class="em">${h.emoji}</span><span class="tx">${escapeHtml(h.name)}</span></div>
      </div>
      <div class="habit-meta">${goalTxt}${h.category?` · ${escapeHtml(h.category)}`:''}</div>
    </td>`;
    days.forEach(d=>{
      const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      const s = getStatus(h.id,k);
      const isFuture = k > todayStr;
      if(!isFuture){ counted++; if(s==="done") done++; }
      let cls = "cell" + (isFuture?" future":s==="done"?" done":s==="missed"?" missed":"");
      const content = s==="done"?"✓":s==="missed"?"✕":"";
      html += `<td class="${cls}" data-habit="${h.id}" data-key="${k}">${content}</td>`;
    });
    const pct = counted ? Math.round((done/counted)*100) : 0;
    html += `<td class="pct-col">${pct}%</td></tr>`;
  });
  html += `</tbody></table></div>`;
  html += `<div class="legend">
    <span><i class="sw" style="background:var(--done-dim);color:var(--done)"></i>✓ cumplido</span>
    <span><i class="sw" style="background:var(--missed-dim)"></i>✕ fallado</span>
    <span><i class="sw" style="background:var(--panel-2)"></i>sin marcar</span>
  </div>`;

  container.innerHTML = html;
  container.querySelectorAll("td.cell:not(.future)").forEach(td=>td.addEventListener("click", ()=>cycleStatus(td.dataset.habit, td.dataset.key)));
  container.querySelectorAll("[data-detail]").forEach(el=>el.addEventListener("click", ()=>showDetail(el.dataset.detail)));
}

function enableRowDrag(container){
  let dragId = null;
  container.querySelectorAll("tr[data-row]").forEach(row=>{
    row.addEventListener("dragstart", (e)=>{
      dragId = row.dataset.row;
      row.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    });
    row.addEventListener("dragend", ()=>{ row.classList.remove("dragging"); container.querySelectorAll("tr").forEach(r=>r.classList.remove("drag-over")); });
    row.addEventListener("dragover", (e)=>{ e.preventDefault(); if(row.dataset.row!==dragId) row.classList.add("drag-over"); });
    row.addEventListener("dragleave", ()=>row.classList.remove("drag-over"));
    row.addEventListener("drop", (e)=>{
      e.preventDefault();
      row.classList.remove("drag-over");
      const targetId = row.dataset.row;
      if(!dragId || dragId===targetId) return;
      reorderHabits(dragId, targetId);
    });
  });
}
function reorderHabits(dragId, targetId){
  const from = state.habits.findIndex(h=>h.id===dragId);
  const to = state.habits.findIndex(h=>h.id===targetId);
  if(from<0 || to<0) return;
  const [moved] = state.habits.splice(from,1);
  state.habits.splice(to,0,moved);
  saveState(); render();
}

function renderYear(){
  document.getElementById("yearLabel").textContent = cursorYear;
  const container = document.getElementById("yearContent");
  const habits = visibleHabits();

  if(activeHabits().length===0){
    container.innerHTML = `<div class="empty"><b>Aún no hay hábitos.</b><br>Agrega el primero arriba para ver tu año.</div>`;
    return;
  }
  if(habits.length===0){
    container.innerHTML = `<div class="empty">Sin resultados para "${escapeHtml(searchTerm)}".</div>`;
    return;
  }

  const y = cursorYear;
  const jan1 = new Date(y,0,1);
  const startOffset = jan1.getDay();
  const totalDays = Math.round((new Date(y,11,31)-jan1)/86400000)+1;
  const weeks = Math.ceil((totalDays+startOffset)/7);
  const today = new Date();

  let html = "";
  habits.forEach(h=>{
    let doneCount=0, totalCount=0;
    const cells = [];
    for(let i=0;i<weeks*7;i++){
      const dayNum = i - startOffset;
      if(dayNum<0 || dayNum>=totalDays){ cells.push(undefined); continue; }
      const d = new Date(y,0,1+dayNum);
      const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      if(d<=today){ totalCount++; const s=getStatus(h.id,k); if(s==="done") doneCount++; cells.push(s); }
      else cells.push(undefined);
    }
    const pct = totalCount ? Math.round((doneCount/totalCount)*100) : 0;
    html += `<div class="year-block" style="--habit-color:${h.color}">
      <h3><span>${h.emoji} ${escapeHtml(h.name)}</span><span class="ypct">${doneCount} días · ${pct}%</span></h3>
      <div class="heat-grid" style="grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(${weeks},1fr);">`;
    cells.forEach(s=>{
      const cls = s==="done"?"heat-cell":s==="missed"?"heat-cell miss":"heat-cell";
      html += `<div class="${cls}" style="${s==='done'?`background:${h.color}`:''}"></div>`;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

function exportCSV(){
  const habits = activeHabits();
  if(!habits.length){ alert("No hay hábitos para exportar."); return; }
  const allDates = new Set();
  habits.forEach(h=>Object.keys(state.entries[h.id]||{}).forEach(k=>allDates.add(k)));
  const dates = Array.from(allDates).sort();
  let csv = "fecha," + habits.map(h=>`"${h.name.replace(/"/g,'')}"`).join(",") + "\n";
  dates.forEach(d=>{
    csv += d + "," + habits.map(h=>{
      const s = getStatus(h.id,d);
      return s==="done" ? "1" : s==="missed" ? "0" : "";
    }).join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "habitos.csv"; a.click();
  URL.revokeObjectURL(url);
}

function syncCategoryFilter(){
  const sel = document.getElementById("categoryFilter");
  const cats = allCategories();
  const cur = sel.value;
  sel.innerHTML = `<option value="">Todas las categorías</option>` + cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
  sel.value = cats.includes(cur) ? cur : "";
}

function render(){
  syncCategoryFilter();
  renderTabs();
  if(currentTab==="today") renderToday();
  else if(currentTab==="dash") renderDash();
  else if(currentTab==="week") renderWeek();
  else if(currentTab==="month") renderMonth();
  else renderYear();
}

document.getElementById("searchBox").addEventListener("input", (e)=>{ searchTerm = e.target.value; render(); });

document.getElementById("nextWeek").addEventListener("click", ()=>{ cursorWeek.setDate(cursorWeek.getDate()+7); render(); });

document.getElementById("prevMonth").addEventListener("click", ()=>{ cursorMonth.setMonth(cursorMonth.getMonth()-1); render(); });
document.getElementById("nextMonth").addEventListener("click", ()=>{ cursorMonth.setMonth(cursorMonth.getMonth()+1); render(); });

document.getElementById("nextYear").addEventListener("click", ()=>{ cursorYear++; render(); });

document.getElementById("detailModal").addEventListener("click", (e)=>{ if(e.target.id==="detailModal") closeDetail(); });

document.getElementById("themeBtn").addEventListener("click", ()=>{
  const isLight = document.documentElement.classList.contains("light");
  applyTheme(isLight ? "dark" : "light");

(async function init(){
  let theme = "dark";
  try{ theme = localStorage.getItem("habit_theme") || "dark"; }catch(e){}
  applyTheme(theme);
  await loadState();
  render();
})();
